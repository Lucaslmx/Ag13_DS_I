  <rect x="80" y="110" width="240" height="120" rx="6" fill="#f5f5f5"/>
  <!-- Topo listrado da claquete -->
  <path d="M80 110 L320 110 L330 70 L70 70 Z" fill="#ef476f"/>
  <path d="M110 70 L130 110 M170 70 L190 110 M230 70 L250 110 M290 70 L310 110" stroke="#f5f5f5" stroke-width="14"/>
