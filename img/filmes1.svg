  <rect x="100" y="150" width="200" height="8" rx="4" fill="#2b2a2f"/>
  <rect x="100" y="172" width="150" height="8" rx="4" fill="#2b2a2f"/>
  <rect x="100" y="194" width="110" height="8" rx="4" fill="#2b2a2f"/>
</svg>
