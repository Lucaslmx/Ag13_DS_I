<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Computador com tela de jogo">
  <rect width="400" height="260" rx="12" fill="#2b2a2f"/>
  <!-- Monitor -->
  <rect x="80" y="45" width="240" height="150" rx="10" fill="#f5f5f5"/>
  <rect x="95" y="60" width="210" height="120" rx="4" fill="#1e1d20"/>
  <!-- Nave simples na tela -->
  <polygon points="200,80 225,150 200,135 175,150" fill="#06d6a0"/>
  <!-- Pedestal e base -->
  <rect x="185" y="195" width="30" height="20" fill="#f5f5f5"/>
  <rect x="150" y="215" width="100" height="10" rx="5" fill="#f5f5f5"/>
</svg>
